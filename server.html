<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ guild.name }} — MT BOT</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        .server-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(88, 101, 242, 0.12),
                    transparent 35%
                ),
                #08090d;
        }

        .server-panel {
            width: min(520px, 100%);
            background: #101117;
            border: 1px solid #23252f;
            border-radius: 22px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .selected-server-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 25px;
            overflow: hidden;
            background: #20222d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: 800;
        }

        .selected-server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-panel h1 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .server-panel p {
            color: #8d909d;
            font-size: 12px;
            margin-bottom: 25px;
        }

        .server-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .server-menu button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #292c38;
            background: #171820;
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .server-menu button:hover {
            background: #5865f2;
            border-color: #5865f2;
        }

        .server-menu .close-btn {
            background: transparent;
            color: #8d909d;
        }

        .server-menu .close-btn:hover {
            background: #1a1b22;
            border-color: #3a3d49;
            color: white;
        }
    </style>
</head>

<body>

<div class="server-page">

    <div class="server-panel">

        <div class="selected-server-icon">

            {% if guild.icon %}

            <img
                src="https://cdn.discordapp.com/icons/{{ guild.id }}/{{ guild.icon }}.png?size=256"
                alt="{{ guild.name }}"
            >

            {% else %}

            {{ guild.name[0]|upper }}

            {% endif %}

        </div>

        <h1>
            {{ guild.name }}
        </h1>

        <p>
            إدارة السيرفر
        </p>

        <div class="server-menu">

            <button
                onclick="alert('سيتم إضافة إعدادات السيرفر قريباً.')"
            >
                إدارة السيرفر
            </button>

            <button
                class="close-btn"
                onclick="window.location.href='/'"
            >
                إغلاق
            </button>

        </div>

    </div>

</div>

</body>
</html>
